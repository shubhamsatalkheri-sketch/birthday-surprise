<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <!-- Confetti library for celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .active {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    h1 {
      color: #d63384;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 25px;
    }
    .btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }

    /* Cake Screen Styles */
    .cake-area {
      position: relative;
      width: 260px;
      height: 220px;
      margin: 20px 0;
      touch-action: none;
    }
    .cake-svg {
      width: 100%;
      height: 100%;
    }
    .cut-line {
      position: absolute;
      top: 55px;
      left: 50%;
      width: 3px;
      height: 0;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 8px #ff4081;
      transform: translateX(-50%);
      transition: height 0.4s ease;
    }
    .cut-line.cut-done {
      height: 140px;
    }
    .slider-guide {
      font-size: 0.95rem;
      color: #777;
      margin-top: 10px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Celebration Screen */
    .characters {
      font-size: 4rem;
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      animation: bounce 0.6s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
    .characters span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .characters span:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* Final Screen */
    .heart {
      font-size: 5rem;
      color: #e60067;
      animation: heartbeat 1.2s infinite;
      margin-bottom: 15px;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .love-text {
      font-size: 2.6rem;
      font-weight: 800;
      color: #c2185b;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="bdayMusic" loop>
    <source src="https://actions.google.com/sounds/v1/holidays/happy_birthday.ogg" type="audio/ogg">
  </audio>

  <!-- Screen 1: Banner -->
  <div class="screen active" id="screen1">
    <div style="font-size: 4rem; margin-bottom: 10px;">🎉🎂🥳</div>
    <h1>Happy Birthday!</h1>
    <p>A special day deserves a special celebration!</p>
    <button class="btn" onclick="goToScreen(2)">Cut the Cake 🎂</button>
  </div>

  <!-- Screen 2: Cake Cutting -->
  <div class="screen" id="screen2">
    <h1>Cut The Cake</h1>
    <p>Cake par ungli upar se neeche slide karein 👇</p>
    
    <div class="cake-area" id="cakeArea">
      <!-- Simple Vector Cake -->
      <svg class="cake-svg" viewBox="0 0 200 180">
        <!-- Candle -->
        <rect x="96" y="20" width="8" height="35" rx="3" fill="#ffeb3b"/>
        <!-- Flame -->
        <ellipse cx="100" cy="15" rx="6" ry="10" fill="#ff9800"/>
        <ellipse cx="100" cy="16" rx="3" ry="6" fill="#ffff00"/>
        <!-- Cake Base Top Tier -->
        <rect x="50" y="55" width="100" height="45" rx="6" fill="#f48fb1"/>
        <path d="M50 70 Q 75 80, 100 70 T 150 70" fill="none" stroke="#fff" stroke-width="4"/>
        <!-- Cake Base Bottom Tier -->
        <rect x="30" y="100" width="140" height="55" rx="8" fill="#ec407a"/>
        <path d="M30 115 Q 65 130, 100 115 T 170 115" fill="none" stroke="#fff" stroke-width="5"/>
      </svg>
      <div class="cut-line" id="cutLine"></div>
    </div>

    <div class="slider-guide">👆 Slide down here to cut</div>
  </div>

  <!-- Screen 3: Cartoon Party -->
  <div class="screen" id="screen3">
    <div class="characters">
      <span>🐱</span>
      <span>🐻</span>
      <span>🐰</span>
    </div>
    <h1>Yay! Party Time! 🥳</h1>
    <p>Let's celebrate this wonderful moment!</p>
    <button class="btn" onclick="goToScreen(4)">Next 💌</button>
  </div>

  <!-- Screen 4: Final Screen -->
  <div class="screen" id="screen4">
    <div class="heart">❤️</div>
    <div class="love-text">I Love You!</div>
    <p style="margin-top: 15px;">Always and forever. ✨</p>
  </div>

  <script>
    const music = document.getElementById('bdayMusic');

    function goToScreen(screenNumber) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen' + screenNumber).classList.add('active');

      if (screenNumber === 3) {
        triggerConfetti();
        // Music starts after user interaction
        music.play().catch(() => console.log('Audio autoplay prevented'));
      }
    }

    // Touch & Mouse slide logic for cake
    const cakeArea = document.getElementById('cakeArea');
    const cutLine = document.getElementById('cutLine');
    let startY = 0;
    let isCutting = false;

    cakeArea.addEventListener('pointerdown', (e) => {
      startY = e.clientY;
      isCutting = true;
    });

    cakeArea.addEventListener('pointermove', (e) => {
      if (!isCutting) return;
      let diff = e.clientY - startY;
      if (diff > 80) { // Slide sensitivity threshold
        isCutting = false;
        cutLine.classList.add('cut-done');
        setTimeout(() => {
          goToScreen(3);
        }, 500);
      }
    });

    cakeArea.addEventListener('pointerup', () => { isCutting = false; });
    cakeArea.addEventListener('pointercancel', () => { isCutting = false; });

    // Celebration Confetti
    function triggerConfetti() {
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }
  </script>
</body>
</html>
